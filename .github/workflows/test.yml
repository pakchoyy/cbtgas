name: Tes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # node:sqlite + --experimental-strip-types
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
