name = "cbt-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Domain kustom (zona cbt-yuk.web.id ada di akun Cloudflare yang sama).
workers_dev = true
routes = [{ pattern = "cbt-yuk.web.id", custom_domain = true }]

# Jalankan Worker dekat database (Neon Singapura): satu halaman butuh beberapa
# query berurutan, jadi jarak ke database lebih penting daripada jarak ke pengguna.
[placement]
mode = "smart"

# Hyperdrive menunjuk ke Neon. Login pakai role cbt_login (NOBYPASSRLS,
# non-pemilik tabel); cbt_app dipakai lewat SET ROLE di dalam transaksi.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "71378b2863a647df8b716a1ca5eef9be"

# Cron trigger: flip exam.status setiap menit berdasarkan starts_at/ends_at.
[triggers]
crons = ["* * * * *"]

[vars]
APP_ENV = "production"
# Tombol "Coba demo" + /auth/dev-login (masuk sebagai admin sekolah demo-sma). Hapus untuk mematikan.
DEMO_LOGIN = "1"
APP_ORIGIN = "https://cbt-yuk.web.id"

# Secrets (set via `wrangler secret put`):
#   GOOGLE_CLIENT_ID       — OAuth 2.0 Client ID (Web application) di Google Cloud
#   GOOGLE_CLIENT_SECRET   — pasangannya
#   SESSION_SECRET         — string acak panjang (≥ 32 byte, mis. `openssl rand -base64 48`)
# Authorized redirect URI di Google: $APP_ORIGIN/auth/google/callback
