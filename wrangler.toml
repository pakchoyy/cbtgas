name = "cbt-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive menunjuk ke Neon. Login pakai role cbt_login (NOBYPASSRLS,
# non-pemilik tabel); cbt_app dipakai lewat SET ROLE di dalam transaksi.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "71378b2863a647df8b716a1ca5eef9be"

# Cron trigger: flip exam.status setiap menit berdasarkan starts_at/ends_at.
[triggers]
crons = ["* * * * *"]

[vars]
APP_ENV = "dev"
APP_ORIGIN = "https://cbt-api.pulsachoy.workers.dev"

# Secrets (set via `wrangler secret put`):
#   GOOGLE_CLIENT_ID       — OAuth 2.0 Client ID (Web application) di Google Cloud
#   GOOGLE_CLIENT_SECRET   — pasangannya
#   SESSION_SECRET         — string acak panjang (≥ 32 byte, mis. `openssl rand -base64 48`)
# Authorized redirect URI di Google: $APP_ORIGIN/auth/google/callback
